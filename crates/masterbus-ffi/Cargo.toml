[package]
name = "masterbus-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI bindings for the masterbus crate (single-threaded use)"
readme = "README.md"
keywords = ["mastervolt", "canbus", "ffi", "marine"]
categories = ["external-ffi-bindings", "hardware-support"]
# Not on crates.io: a cdylib/staticlib is consumed via the GitHub release
# artifacts (the prebuilt libs + generated masterbus.h), not via `cargo add`.
publish = false

[lib]
name = "masterbus_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
masterbus.workspace = true

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
