[package]
name = "masterbus-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tools for Mastervolt MasterBus: terminal UI, Signal K sidecar, field writer, bus dump"
readme = "README.md"
keywords = ["mastervolt", "masterbus", "canbus", "marine"]
categories = ["command-line-utilities", "hardware-support"]

# Internal only: it exists so the binaries below can share the Signal K
# mapping format, unit conversion and suggestion tables. Cargo cannot ship a
# package's binaries without its library, so this is published, but it carries
# no stability guarantee and is hidden from the rendered docs. The stable
# surface of this project is the `masterbus` library and these tools' own
# arguments and file formats.
[lib]
name = "masterbus_tools"
path = "src/lib.rs"

[[bin]]
name = "masterbus-tui"
path = "src/bin/masterbus-tui/main.rs"

[[bin]]
name = "masterbus-signalk"
path = "src/bin/masterbus-signalk.rs"

[[bin]]
name = "masterbus-set-field"
path = "src/bin/masterbus-set-field.rs"

[[bin]]
name = "masterbus-dump"
path = "src/bin/masterbus-dump.rs"

[dependencies]
masterbus.workspace = true
ratatui.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
tui-logger = { version = "0.18", default-features = false, features = ["crossterm"] }
