[package]
name = "masterbus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Idiomatic Rust client for the Mastervolt MasterBus CAN-bus protocol"
readme = "README.md"
keywords = ["mastervolt", "canbus", "nmea2000", "marine", "socketcan"]
categories = ["embedded", "hardware-support", "network-programming"]

[lib]
name = "masterbus"

[dependencies]
thiserror.workspace = true
crossbeam-channel.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
# Cross-platform Mastervolt USB-link (HID) transport.
hidapi.workspace = true

# The live SocketCAN backend is Linux-only; the crate still builds elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
socketcan.workspace = true
