[package]
name = "masterbus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Idiomatic Rust client for the Mastervolt MasterBus CAN-bus protocol"
readme = "README.md"
keywords = ["mastervolt", "canbus", "nmea2000", "marine", "socketcan"]
categories = ["embedded", "hardware-support", "network-programming"]

[lib]
name = "masterbus"

[features]
# Build the scriptable fake device (`masterbus::fakebus`) into the library,
# so a program can run against a canned bus with no hardware.
fake-bus = []

# docs.rs documents the fake bus too, so its API is visible without
# enabling the feature locally.
[package.metadata.docs.rs]
all-features = true

[dependencies]
thiserror.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
env_logger.workspace = true

# Cross-platform Mastervolt USB-link (HID) transport. On Linux the link is
# read and written through its /dev/hidrawN node directly (libc for poll):
# hidapi's Linux backend enumerates every HID device first, reading every
# sysfs attribute of their parents (signalk-masterbus#4). macOS/Windows use
# hidapi's default (IOKit / windows-sys) backends.
[target.'cfg(target_os = "linux")'.dependencies]
socketcan.workspace = true
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = "2"
