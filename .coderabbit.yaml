# CodeRabbit configuration. Schema:
#   https://coderabbit.ai/integrations/schema.v2.json
#
# MasterBus is a reverse-engineered protocol: most of what a reviewer can add
# is checking a change against docs/PROTOCOL.md and against the people who
# run it, who are boat owners rather than Unix users.

language: en-US

reviews:
  # Comment where it matters rather than on every diff hunk.
  profile: chill
  # Advisory only: a bot must not hold a maintainer's PR closed.
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "[skip review]"
      - "[WIP]"

  path_filters:
    - "!Cargo.lock"
    - "!target/**"
    # Captured bus snapshots, data rather than code.
    - "!samples/*.json"

  path_instructions:
    - path: "**/*"
      instructions: |
        The CHANGELOG is written by hand, in Keep a Changelog form: a
        user-visible change adds an entry under `## [Unreleased]`, in the
        Added / Changed / Fixed order. Flag a behaviour change without one.
        Entries are for users, so they say what changed for them, not which
        function moved.

        Anything learned about the wire belongs in docs/PROTOCOL.md in the
        same PR (CONTRIBUTING.md §4). Flag a change to frame encoding,
        decoding or discovery that contradicts PROTOCOL.md or adds a new
        wire fact without documenting it.

        Commits and PR descriptions carry AI-attribution trailers on
        purpose; do not flag them.

    - path: "crates/masterbus/src/protocol/**"
      instructions: |
        Frames come off a shared CAN bus and may be short, truncated or from
        a device firmware we have not seen. Watch for indexing past the
        payload, unchecked lengths, and byte order (the protocol mixes
        little-endian values with big-endian ids). Prefer evidence from
        captured traffic over plausible inference; an unexplained byte is
        unknown, not guessed at.

    - path: "crates/masterbus/src/runtime/**"
      instructions: |
        The scheduler paces every request on a bus shared with Mastervolt's
        own devices and displays. Flag changes that could raise the request
        rate, retry without backoff, or let one unresponsive device starve
        the others. A write that switches something (an inverter, a DC
        output) acts on real equipment on a boat: check it cannot be sent
        twice, to the wrong address, or without the caller asking.

    - path: "crates/masterbus/src/transport/**"
      instructions: |
        The USB link and SocketCAN run on Linux (often a Raspberry Pi),
        macOS and Windows; code under `#[cfg(target_os = ...)]` is only
        compiled in CI on that platform. Check each cfg branch on its own,
        and that a disconnected link surfaces as an error rather than a
        busy loop.

    - path: "crates/masterbus-ffi/src/**"
      instructions: |
        This is a C ABI. Check null and length handling on every pointer
        from C, that no panic crosses the boundary, and that a change to an
        exported signature is matched in include/masterbus.h (generated by
        cbindgen) and the C demos under crates/masterbus-ffi/c/.

    - path: "**/*.md"
      instructions: |
        README.md, ENDUSER.md and HARDWARE.md are read by boat owners who
        are not developers: flag jargon without explanation, commands that
        are not copy-pasteable, and steps that assume a Unix habit.
        docs/PROTOCOL.md is a reverse-engineering record; specific
        addresses, byte layouts and firmware versions are expected there.

    - path: ".github/workflows/**"
      instructions: |
        Release binaries are built here for six targets, including static
        musl Linux builds for Raspberry Pi. Flag a change that would make a
        Linux binary depend on the runner's glibc or a system library, or
        drop a target that a release attaches.

chat:
  auto_reply: true
