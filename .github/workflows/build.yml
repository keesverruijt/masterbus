name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # attach release assets on tag builds
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built against musl so the binaries are fully static
          # and run on any distro regardless of its glibc (#20: the gnu
          # builds wanted the runner's glibc 2.39, newer than Raspberry
          # Pi OS bookworm ships). The workspace is pure Rust on Linux
          # (hidapi uses its native hidraw backend), so no musl C
          # toolchain is needed: rustc supplies musl's crt and libc from
          # its own target bundle, and the gnu cross gcc only drives ld.
          - { target: x86_64-unknown-linux-musl,     os: ubuntu-latest,  packages: "",                      rustflags: "" }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, packages: gcc-arm-linux-gnueabihf, rustflags: "" } # armhf
          - { target: aarch64-unknown-linux-musl,    os: ubuntu-latest,  packages: gcc-aarch64-linux-gnu,   rustflags: "" }
          - { target: x86_64-pc-windows-msvc,        os: windows-latest, packages: "",                      rustflags: "-C target-feature=+crt-static" }
          - { target: aarch64-apple-darwin,          os: macos-latest,   packages: "",                      rustflags: "" }
          - { target: x86_64-apple-darwin,           os: macos-latest,   packages: "",                      rustflags: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (Linux cross targets)
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Lint and test once, on the native Linux target.
      - name: Clippy, tests & docs
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          # Intra-doc links rot silently when an item is renamed or moves
          # between modules; nothing else in the build notices.
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo doc --workspace --no-deps

      - name: Build release (whole workspace)
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --workspace --target ${{ matrix.target }}

      # Shippable artifacts: the four `masterbus-tools` binaries (TUI
      # + set-field + dump everywhere, signalk on Linux only), the FFI
      # library + header, and (Linux only) the signalk systemd unit. On
      # Linux (musl) rustc drops the cdylib crate type, so only the
      # static libmasterbus_ffi.a ships there, no .so. The
      # `masterbus` core crate is an rlib (consumed via crates.io) and
      # has no standalone binary; it is still built / checked as part
      # of the workspace above.
      - name: Stage artifacts
        shell: bash
        run: |
          out="target/${{ matrix.target }}/release"
          dist="masterbus-${{ matrix.target }}"
          mkdir -p "$dist"
          cp crates/masterbus-ffi/include/masterbus.h "$dist/"
          # Cross-platform tools (with or without .exe)
          for b in masterbus-tui masterbus-set-field masterbus-dump; do
            if [ -f "$out/$b.exe" ]; then cp "$out/$b.exe" "$dist/"; else cp "$out/$b" "$dist/"; fi
          done
          # FFI library + static lib (whichever names this platform produced)
          for f in libmasterbus_ffi.so libmasterbus_ffi.dylib libmasterbus_ffi.a \
                   masterbus_ffi.dll masterbus_ffi.dll.lib masterbus_ffi.lib; do
            [ -f "$out/$f" ] && cp "$out/$f" "$dist/"
          done
          # Signal K sidecar is Linux/SocketCAN-only.
          case "${{ matrix.target }}" in
            *linux*)
              cp "$out/masterbus-signalk" "$dist/"
              cp crates/masterbus-tools/etc/masterbus-signalk.service "$dist/"
              ;;
          esac
          echo "DIST=$dist" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST }}
          path: ${{ env.DIST }}/

      - name: Package tarball (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: tar czf "${{ env.DIST }}.tar.gz" "${{ env.DIST }}"

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST }}.tar.gz
