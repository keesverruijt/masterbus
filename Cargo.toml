[workspace]
resolver = "2"
members = [
    "crates/masterbus",
    "crates/masterbus-ffi",
    "crates/masterbus-tui",
    "crates/masterbus-signalk",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/keesverruijt/masterbus"

[workspace.dependencies]
thiserror = "2"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketcan = "3"
ratatui = "0.30"
masterbus = { path = "crates/masterbus", version = "0.2.0" }

[profile.release]
opt-level = "z"
lto = true
