[workspace]
resolver = "2"
members = [
    "crates/masterbus",
    "crates/masterbus-ffi",
    "crates/masterbus-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketcan = "3"
ratatui = "0.30"
masterbus = { path = "crates/masterbus" }

[profile.release]
opt-level = "z"
lto = true
