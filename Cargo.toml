[workspace]
resolver = "2"
members = [
    "crates/masterbus",
    "crates/masterbus-ffi",
    "crates/masterbus-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-xml-rs = "0.6"
socketcan = "3"
masterbus = { path = "crates/masterbus" }

[profile.release]
opt-level = "z"
lto = true
